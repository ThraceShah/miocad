[workspace]
resolver = "2"
members = ["crates/cad-protocol", "crates/cad-client", "crates/cad-service", "crates/cad-render", "crates/cad-access", "crates/cad-cli", "crates/cad-mcp", "crates/cad-ui-egui", "crates/cad-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros", "net", "sync", "signal", "io-std"] }
cad-protocol = { path = "crates/cad-protocol" }

base64 = "0.22.1"
png = "0.17.16"
cad-client = { path = "crates/cad-client" }
cad-render = { path = "crates/cad-render" }
cad-access = { path = "crates/cad-access" }

egui = "=0.33.3"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "wgpu", "x11"] }
cad-ui-egui = { path = "crates/cad-ui-egui" }
